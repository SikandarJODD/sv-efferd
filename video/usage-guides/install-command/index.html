<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="../shared.css" />
		<style>
			.content {
				position: absolute;
				top: 132px;
				left: 180px;
				width: 1560px;
			}

			.eyebrow {
				color: var(--muted-foreground);
				font-size: 22px;
				font-weight: 500;
				letter-spacing: 0.02em;
			}

			h1 {
				margin-top: 12px;
				font-size: 56px;
				font-weight: 560;
				letter-spacing: -0.035em;
			}

			.description {
				margin-top: 14px;
				color: var(--muted-foreground);
				font-size: 25px;
			}

			.toolbar {
				display: flex;
				align-items: center;
				justify-content: space-between;
				margin-top: 78px;
				min-height: 92px;
				border-bottom: 1px solid var(--border);
				background: var(--background);
			}

			.mode {
				display: flex;
				align-items: center;
				gap: 8px;
				will-change: opacity;
			}

			.mode span {
				display: inline-flex;
				align-items: center;
				height: 48px;
				border-radius: 999px;
				padding: 0 20px;
				font-size: 20px;
				font-weight: 530;
			}

			.mode .active {
				background: var(--muted);
			}

			.install {
				display: flex;
				align-items: stretch;
				width: 950px;
				height: 60px;
				overflow: hidden;
				border: 2px solid var(--blue);
				border-radius: 10px;
				background: var(--background);
				will-change: transform;
			}

			.command {
				display: flex;
				min-width: 0;
				flex: 1;
				align-items: center;
				gap: 16px;
				padding: 0 18px;
				background: var(--blue-soft);
			}

			.agent {
				position: relative;
				display: grid;
				width: 28px;
				height: 28px;
				flex: none;
				grid-template-columns: repeat(2, 8px);
				grid-template-rows: repeat(2, 8px);
				gap: 3px;
				align-content: center;
				justify-content: center;
			}

			.agent-dot {
				background: #f69220;
			}

			.check {
				position: absolute;
				inset: 0;
				display: grid;
				place-items: center;
				color: var(--blue);
				opacity: 0;
				will-change: opacity, transform;
			}

			.command-text {
				overflow: hidden;
				color: #262626;
				font-size: 19px;
				white-space: nowrap;
				text-overflow: ellipsis;
			}

			.chevron {
				display: grid;
				width: 62px;
				place-items: center;
				border-left: 1px solid #bfdbfe;
				color: var(--muted-foreground);
			}

			.preview {
				position: relative;
				height: 310px;
				margin-top: 24px;
				overflow: hidden;
				border: 1px solid var(--border);
				border-radius: 14px;
				will-change: opacity;
			}

			.preview-copy {
				position: absolute;
				top: 68px;
				left: 80px;
				width: 500px;
			}

			.preview-copy div {
				height: 18px;
				margin-bottom: 18px;
				border-radius: 5px;
				background: #ededed;
			}

			.preview-copy div:nth-child(1) {
				width: 64%;
				height: 34px;
				background: #d4d4d4;
			}

			.preview-copy div:nth-child(2) {
				width: 92%;
			}

			.preview-copy div:nth-child(3) {
				width: 78%;
			}

			.preview-grid {
				position: absolute;
				top: 52px;
				right: 70px;
				display: grid;
				grid-template-columns: repeat(2, 220px);
				gap: 16px;
			}

			.preview-grid div {
				height: 92px;
				border: 1px solid var(--border);
				border-radius: 10px;
				background: #fafafa;
			}
		</style>
	</head>
	<body>
		<section class="scene">
			<div class="content">
				<p class="eyebrow">FEATURE BLOCKS</p>
				<h1>Feature One</h1>
				<p class="description">A split feature section with focused product details.</p>

				<div class="toolbar">
					<div class="mode" id="mode">
						<span class="active">Preview</span>
						<span>Code</span>
					</div>
					<div class="install" id="install">
						<div class="command">
							<div class="agent" id="agent">
								<span class="agent-dot"></span><span class="agent-dot"></span>
								<span class="agent-dot"></span><span class="agent-dot"></span>
								<span class="check" id="check">
									<svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
										<path d="m5 12 4 4L19 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
									</svg>
								</span>
							</div>
							<span class="command-text mono">pnpm dlx shadcn-svelte@latest add …/r/feature-one.json</span>
						</div>
						<div class="chevron">
							<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
								<path d="m7 10 5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
							</svg>
						</div>
					</div>
				</div>

				<div class="preview" id="preview">
					<div class="preview-copy"><div></div><div></div><div></div></div>
					<div class="preview-grid"><div></div><div></div><div></div><div></div></div>
				</div>
			</div>
			<img class="cursor" id="cursor" src="../cursors/hand.png" alt="" />
		</section>

		<script src="../shared.js"></script>
		<script>
			window.DURATION = 6;
			const cursor = document.getElementById("cursor");
			const install = document.getElementById("install");
			const mode = document.getElementById("mode");
			const preview = document.getElementById("preview");
			const check = document.getElementById("check");
			const dots = [...document.querySelectorAll(".agent-dot")];
			const start = { x: 1980, y: 870 };
			const target = { x: 1120, y: 397 };
			const entryControl = { x: 1640, y: 670 };
			const exit = { x: 1990, y: 760 };
			const exitControl = { x: 1640, y: 590 };

			window.render = (time) => {
				const enter = interval(time, 0.3, 0.9);
				const leave = interval(time, 4.75, 0.8);
				let point = quadraticPoint(start, entryControl, target, enter);
				if (time >= 4.75) point = quadraticPoint(target, exitControl, exit, leave);

				const cursorVisible = interval(time, 0.2, 0.18) * (1 - interval(time, 5.45, 0.16));
				const press = pressAmount(time, 1.45);
				setCursor(cursor, point, cursorVisible, 1 - press * 0.08);

				const copiedIn = interval(time, 1.48, 0.18, easeOut);
				const copiedOut = interval(time, 4.65, 0.22, easeOut);
				const copied = copiedIn * (1 - copiedOut);
				install.style.transform = `scale(${1 - press * 0.012})`;
				check.style.opacity = copied;
				check.style.transform = `scale(${0.75 + copied * 0.25})`;
				dots.forEach((dot) => {
					dot.style.opacity = 1 - copied;
					dot.style.transform = `scale(${1 - copied * 0.25})`;
				});
				mode.style.opacity = 0.42;
				preview.style.opacity = 0.42;
			};

			window.render(0);
		</script>
	</body>
</html>
